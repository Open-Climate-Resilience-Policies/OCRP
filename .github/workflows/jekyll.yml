name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install
      
      - name: Install Python dependencies
        run: pip install pyyaml
      
      - name: Validate frontmatter
        run: python3 scripts/validate_frontmatter.py
          
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install NPM dependencies
        run: npm ci || npm install
        
      - name: Build Search Index
        run: npm run build:search
      
      - name: Verify critical pages exist
        run: |
          MISSING=""
          for page in about/index.html contribute/index.html policies/index.html; do
            if [ ! -f "_site/$page" ]; then
              echo "❌ Missing: $page"
              MISSING="$MISSING $page"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Critical pages missing:$MISSING"
            exit 1
          fi
          echo "✅ All critical pages generated"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
