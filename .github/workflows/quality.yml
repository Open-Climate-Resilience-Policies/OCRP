name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jekyll-build:
    name: Jekyll Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.7'
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Set up Node.js for search index
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build search index
        run: npm run build:search

      - name: Verify build output
        run: |
          test -d _site
          test -f _site/index.html
          test -d _site/policies
          echo "✅ Jekyll build completed successfully"

      - name: Verify critical pages exist
        run: |
          MISSING=""
          for page in about/index.html contribute/index.html policies/index.html; do
            if [ ! -f "_site/$page" ]; then
              echo "❌ Missing: $page"
              MISSING="$MISSING $page"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Critical pages missing:$MISSING"
            exit 1
          fi
          echo "✅ All critical pages generated"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: _site/
          retention-days: 1

  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: jekyll-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Create html-validate config
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "no-inline-style": "off",
              "require-sri": "off"
            }
          }
          EOF

      - name: Validate HTML
        run: |
          html-validate "_site/**/*.html" || true
          echo "✅ HTML validation completed"

  accessibility:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    needs: jekyll-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:accessibility

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: playwright-report/
          retention-days: 7

  behavior-tests:
    name: Behavior Testing
    runs-on: ubuntu-latest
    needs: jekyll-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run behavior tests
        run: npm run test:behavior

      - name: Upload behavior test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-results
          path: playwright-report/
          retention-days: 7

  behavior-traceability:
    name: Feature/Test Traceability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce feature/test parity
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            fi
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          FEATURES_CHANGED=false
          TESTS_CHANGED=false

          if echo "$CHANGED_FILES" | grep -Eq '^(FEATURES\.md|features/.*\.feature)$'; then
            FEATURES_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^tests/behavior/.*\.(js|ts)$'; then
            TESTS_CHANGED=true
          fi

          if [ "$FEATURES_CHANGED" != "$TESTS_CHANGED" ]; then
            echo "❌ Feature/test parity check failed."
            echo "Feature docs changed: $FEATURES_CHANGED"
            echo "Behavior tests changed: $TESTS_CHANGED"
            echo "Update both feature specs and behavior tests in the same PR."
            exit 1
          fi

          echo "✅ Feature/test parity check passed."

  javascript-quality:
    name: JavaScript Quality
    runs-on: ubuntu-latest
    if: false  # Enable when JS files exist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install -g eslint

      - name: Create ESLint config
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 12,
              "sourceType": "script"
            },
            "rules": {
              "no-console": "off",
              "no-unused-vars": "warn"
            }
          }
          EOF

      - name: Lint JavaScript
        run: |
          if [ -d "assets/js" ]; then
            eslint "assets/js/**/*.js" || exit 1
          fi
          if [ -d "tools" ]; then
            eslint "tools/**/*.js" || exit 1
          fi
          echo "✅ JavaScript quality checks passed"

  security-privacy:
    name: Security & Privacy Check
    runs-on: ubuntu-latest
    needs: jekyll-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site/

      - name: Check for tracking code
        run: |
          echo "Checking for third-party analytics..."
          
          # Check for common analytics/tracking services
          if grep -r "google-analytics\|googletagmanager\|ga\.js\|gtag\.js\|analytics\.js" _site/ 2>/dev/null; then
            echo "❌ Google Analytics detected"
            exit 1
          fi
          
          if grep -r "facebook\.com/tr\|facebook\.net\|fbevents\.js" _site/ 2>/dev/null; then
            echo "❌ Facebook tracking detected"
            exit 1
          fi
          
          if grep -r "hotjar\|mouseflow\|crazyegg" _site/ 2>/dev/null; then
            echo "❌ User tracking/recording detected"
            exit 1
          fi
          
          echo "✅ No third-party tracking detected"

      - name: Check for localStorage/sessionStorage usage
        run: |
          echo "Checking for storage usage..."
          
          if grep -r "localStorage\|sessionStorage" _site/ 2>/dev/null; then
            echo "⚠️  localStorage/sessionStorage usage detected - verify it's documented"
            # Don't fail, just warn
          else
            echo "✅ No storage usage detected"
          fi

      - name: Check for external script sources
        run: |
          echo "Checking for external scripts..."
          
          # Allow specific domains
          if grep -r "<script.*src=" _site/ | grep -v "relative_url" | grep -v "http://localhost" | grep -v "127.0.0.1" 2>/dev/null; then
            echo "⚠️  External scripts detected - verify they are necessary"
            grep -r "<script.*src=" _site/ | grep -v "relative_url" || true
          else
            echo "✅ No unexpected external scripts"
          fi
