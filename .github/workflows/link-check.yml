name: Link Check (Policies)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  link-check:
    name: Build site and check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Bundler and gems
        run: |
          gem install bundler --conservative
          bundle install --jobs 4 --retry 3

      - name: Build site (Jekyll)
        run: |
          bundle exec jekyll build --destination _site

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run policy `official_sources` link scanner
        id: policy-links
        run: |
          python3 scripts/find_broken_links.py > link-check.json
          python3 - <<'PY'
import json,sys
results=json.load(open('link-check.json'))
bad=[e for e in results if e.get('status_code') is None or (isinstance(e.get('status_code'),int) and e.get('status_code')>=400)]
if bad:
    print('Broken official_sources detected (first 20):')
    import pprint
    pprint.pprint(bad[:20])
    sys.exit(1)
print('No broken official_sources found.')
PY

      - name: Upload link-check.json (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check.json
          path: link-check.json
