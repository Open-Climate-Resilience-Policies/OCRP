name: Link Check (Policies)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  link-check:
    name: Build site and check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Bundler and gems
        run: |
          gem install bundler --conservative
          bundle install --jobs 4 --retry 3

      - name: Build site (Jekyll)
        run: |
          bundle exec jekyll build --destination _site

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run policy `official_sources` link scanner
        id: policy-links
        run: |
          python3 scripts/find_broken_links.py > link-check.json
          python3 - <<'PY'
import json,sys
results=json.load(open('link-check.json'))
# 403/401/429: bot-blocking or auth-required — warn but do not fail.
# 404/410 and connection errors (None): definitively broken.
UNCERTAIN_CODES = {401, 403, 429}
bad=[]
warn=[]
for e in results:
    code = e.get('status_code')
    if code is None:
        bad.append(e)
    elif isinstance(code, int):
        if code in UNCERTAIN_CODES:
            warn.append(e)
        elif code >= 400:
            bad.append(e)
if warn:
    print('WARNING — URLs that may be bot-blocked or require auth (not counted as failures):')
    import pprint
    pprint.pprint(warn[:20])
if bad:
    print('Broken official_sources detected (first 20):')
    import pprint
    pprint.pprint(bad[:20])
    sys.exit(1)
print('No broken official_sources found.')
PY

      - name: Upload link-check.json (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check.json
          path: link-check.json
